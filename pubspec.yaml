name: gastoscan_ai
description: "GastoScan AI - Digitalización inteligente de facturas y comprobantes con Gemini Multimodal y SQLite local."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  cloud_functions: ^5.1.3
  flutter:
    sdk: flutter

  # Persistencia y Base de Datos Local
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Procesamiento de IA Multimodal
  http: ^1.2.1

  # Captura y Optimización de Imágenes
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3

  # Gestión de Estado
  provider: ^6.1.2

  # Gráficos y Utilidades UI
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # Exportación y Compartir Archivos
  csv: ^6.0.0
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
