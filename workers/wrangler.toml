name = "rindemas-gateway"
main = "src/index.js"
compatibility_date = "2024-09-23"

[vars]
FIREBASE_PROJECT_ID = "gastoscan-ai"

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "rindemas-usage"
database_id = "d29a43ee-3ec9-4ea8-9396-6e17220392d5"

# Envío automático de tasa de cambio diaria: lunes a viernes 8:30 AM VET (12:30 UTC)
[triggers]
crons = ["30 12 * * 1-5"]

# Secretos configurados con wrangler secret put:
# - GEMINI_API_KEY
# - FIREBASE_SERVICE_ACCOUNT_JSON (JSON de cuenta de servicio con rol Firebase Cloud Messaging API Admin)
