name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerar estructura nativa de Android compatible
        run: |
          rm -rf android
          flutter create --org com.gastoscan.ai --project-name gastoscan_ai --platforms android .

      - name: Inyectar permisos en AndroidManifest
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
          '''

          if '<uses-permission' not in content:
              content = content.replace('<application', permissions + '
    <application')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(content)
          print('Permisos agregados con exito')
          "

      - name: Instalar paquetes
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Guardar instalador APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: GastoScanAI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
