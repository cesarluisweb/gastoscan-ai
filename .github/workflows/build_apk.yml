name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar y guardar Keystore Permanente
        run: |
          if [ ! -f "android_template/rindemas.jks" ]; then
            keytool -genkey -v -keystore android_template/rindemas.jks -keyalg RSA -keysize 2048 -validity 10000 -alias rindemas -dname "CN=RindeMas, OU=App, O=RindeMas, L=Caracas, ST=Caracas, C=VE" -storepass rindemas123 -keypass rindemas123
            git config --global user.email "bot@gastoscan.ai"
            git config --global user.name "GastoScan Bot"
            git add android_template/rindemas.jks
            git commit -m "chore: generar keystore de produccion para Google Sign-In"
            git push
          fi
          echo "==== HUELLA SHA-1 PARA FIREBASE ===="
          keytool -list -v -keystore android_template/rindemas.jks -alias rindemas -storepass rindemas123 -keypass rindemas123 | grep SHA1



      - name: Descargar Gradle 9.3.1 con reintentos automaticos
        run: |
          echo "Descargando gradle-9.3.1-bin.zip..."
          curl -fL --retry 10 --retry-delay 5 --retry-connrefused -o /tmp/gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          ls -lh /tmp/gradle-9.3.1-bin.zip
          # Configurar wrapper para usar el archivo local descargado
          sed -i 's|distributionUrl=.*|distributionUrl=file\:/tmp/gradle-9.3.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Instalar paquetes
        run: flutter pub get

      - name: Analisis Estatico de Codigo
        run: |
          touch test_results.txt
          flutter analyze --fatal-warnings --no-fatal-infos || (flutter analyze > test_results.txt && cat test_results.txt && exit 1)

      - name: Ejecutar Unit Tests
        run: flutter test > test_results.txt || (cat test_results.txt && exit 1)

      - name: Guardar Logs de Error
        if: failure()
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add test_results.txt
          git commit -m "chore: ci test failure logs"
          git push || true
          exit 1

      - name: Generar Iconos de App
        run: flutter pub run flutter_launcher_icons

      - name: Configurar Reglas de ProGuard (R8) para ML Kit
        run: |
          mkdir -p android/app
          cat << 'EOF' > android/app/proguard-rules.pro
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          -keep class com.google.mlkit.vision.text.latin.** { *; }
          -keep class com.google_mlkit_text_recognition.** { *; }
          EOF
          
          # Inyectar configuracion de proguard-rules.pro en android/app/build.gradle.kts
          if ! grep -q "proguardFiles" android/app/build.gradle.kts; then
            python3 -c '
          with open("android/app/build.gradle.kts", "r") as f:
              content = f.read()
          target = "signingConfig = signingConfigs.getByName(\"debug\")"
          replacement = target + "\n            proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")"
          new_content = content.replace(target, replacement)
          with open("android/app/build.gradle.kts", "w") as f:
              f.write(new_content)
          '
          fi
          cat android/app/proguard-rules.pro
          cat android/app/build.gradle.kts

      - name: Compilar APK Release
        run: |
          APP_VERSION=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 1 | tr -d '[:space:]')
          BASE_BUILD=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 2 | tr -d '[:space:]')
          BUILD_NUM=$(( BASE_BUILD + ${{ github.run_number }} ))
          echo "Compilando Rinde Más v$APP_VERSION (Build $BUILD_NUM)..."
          flutter build apk --release --no-tree-shake-icons --build-name="$APP_VERSION" --build-number="$BUILD_NUM" --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
        
      - name: Firmar APK con Keystore de Produccion
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          # Alineacion
          $BUILD_TOOLS/zipalign -v -p 4 build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-aligned.apk
          # Firma
          $BUILD_TOOLS/apksigner sign --ks android_template/rindemas.jks --ks-pass pass:rindemas123 --ks-key-alias rindemas --key-pass pass:rindemas123 --out build/app/outputs/flutter-apk/app-release-signed.apk build/app/outputs/flutter-apk/app-release-aligned.apk
          # Reemplazar el original
          mv build/app/outputs/flutter-apk/app-release-signed.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Compilar Android App Bundle (AAB de Produccion)
        run: |
          APP_VERSION=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 1 | tr -d '[:space:]')
          BASE_BUILD=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 2 | tr -d '[:space:]')
          BUILD_NUM=$(( BASE_BUILD + ${{ github.run_number }} ))
          echo "Compilando AAB para Google Play v$APP_VERSION (Build $BUILD_NUM)..."
          flutter build appbundle --release --no-tree-shake-icons --build-name="$APP_VERSION" --build-number="$BUILD_NUM" --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Firmar AAB con Keystore de Produccion
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android_template/rindemas.jks -storepass rindemas123 -keypass rindemas123 build/app/outputs/bundle/release/app-release.aab rindemas
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab

      - name: Subir AAB como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Limpiar Release Assets Anteriores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset latest app-release.apk --yes 2>/dev/null || true
          gh release delete-asset latest app-release.aab --yes 2>/dev/null || true

      - name: Publicar Release (Descarga Directa)
        uses: ncipollo/release-action@v1
        continue-on-error: true
        with:
          artifacts: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          tag: "latest"
          name: "Ultima Version"
          body: "Descarga directa de la ultima version estable de Rinde Más (APK y AAB para Google Play)."
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Preparar y Subir APK a BanaHosting por FTP
        run: |
          mkdir -p ftp_deploy
          cp build/app/outputs/flutter-apk/app-release.apk ftp_deploy/rindemas.apk
          cp build/app/outputs/flutter-apk/app-release.apk ftp_deploy/app-release.apk

      - name: Subir APK a BanaHosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        # SIN continue-on-error a proposito: si el APK no sube, el job debe
        # detenerse AQUI para no publicar un version.json que anuncie un build
        # inexistente (fail-closed en distribucion).
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ftp_deploy/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Verificar APK publicado
        # Fail-closed: el version.json (paso siguiente) solo debe generarse si
        # el APK compilado es el que sirve el redirect. Compara tamanos con
        # reintentos por propagacion del servidor usando cache buster para bypass de Cloudflare.
        run: |
          LOCAL_SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)
          APP_VERSION=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 1 | tr -d '[:space:]')
          BASE_BUILD=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 2 | tr -d '[:space:]')
          BUILD_NUM=$(( BASE_BUILD + ${{ github.run_number }} ))
          
          for i in 1 2 3 4 5; do
            REMOTE_SIZE=$(curl -sI "https://cesarluis.com/rindemas/rindemas.apk?b=$BUILD_NUM" | grep -i '^content-length' | tr -d '\r' | awk '{print $2}')
            if [ "$REMOTE_SIZE" = "$LOCAL_SIZE" ]; then echo "APK verificado: $LOCAL_SIZE bytes"; exit 0; fi
            echo "Intento $i: local=$LOCAL_SIZE remoto=$REMOTE_SIZE. Reintentando en 15s..."
            sleep 15
          done
          echo "ERROR: el APK publicado no coincide con el compilado" && exit 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar version.json y Compilar Landing
        run: |
          # Extraer version y build number dinamico (BASE_BUILD + github.run_number)
          APP_VERSION=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 1 | tr -d '[:space:]')
          BASE_BUILD=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 2 | tr -d '[:space:]')
          BUILD_NUM=$(( BASE_BUILD + ${{ github.run_number }} ))
          
          # Verificar si se marca como actualizacion mayor
          IS_MAJOR=false
          if grep -q "is_major_release: true" pubspec.yaml 2>/dev/null; then
            IS_MAJOR=true
          fi
          
          cat <<EOF > landing/public/version.json
          {
            "version": "$APP_VERSION",
            "buildNumber": $BUILD_NUM,
            "isMajor": $IS_MAJOR,
            "releaseNotes": "Actualización de Rinde Más con mejoras de rendimiento y nuevas funciones.",
            "apkUrl": "https://rindemas.cesarluis.com/rindemas.apk?b=$BUILD_NUM"
          }
          EOF
          
          cat landing/public/version.json
          cd landing
          npm install
          npm run build
          cd ..

      - name: Desplegar Landing y APK a Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GATOSCAN_AI }}
        run: |
          npx firebase-tools deploy --only hosting --project gastoscan-ai --token "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GATOSCAN_AI }}" --non-interactive
