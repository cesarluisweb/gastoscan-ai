name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar plataforma Android nativa y aplicar permisos
        run: |
          rm -rf android
          flutter create --org com.gastoscan.ai --project-name gastoscan_ai --platforms android .
          cp android_template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Instalar paquetes
        run: flutter pub get

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Guardar instalador APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: GastoScanAI-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
