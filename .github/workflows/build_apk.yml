name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar y guardar Keystore Permanente
        run: |
          if [ ! -f "android_template/rindemas.jks" ]; then
            keytool -genkey -v -keystore android_template/rindemas.jks -keyalg RSA -keysize 2048 -validity 10000 -alias rindemas -dname "CN=RindeMas, OU=App, O=RindeMas, L=Caracas, ST=Caracas, C=VE" -storepass rindemas123 -keypass rindemas123
            git config --global user.email "bot@gastoscan.ai"
            git config --global user.name "GastoScan Bot"
            git add android_template/rindemas.jks
            git commit -m "chore: generar keystore de produccion para Google Sign-In"
            git push
          fi
          echo "==== HUELLA SHA-1 PARA FIREBASE ===="
          keytool -list -v -keystore android_template/rindemas.jks -alias rindemas -storepass rindemas123 -keypass rindemas123 | grep SHA1

      - name: Generar plataforma Android nativa y aplicar permisos
        run: |
          rm -rf android
          flutter create --org com.gastoscan.ai --project-name gastoscan_ai --platforms android .
          cp android_template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
      - name: Inyectar Keystore en build.gradle
        run: |
          python3 -c "
          with open('android/app/build.gradle', 'r') as f: content = f.read()
          signing_config = '''
              signingConfigs {
                  release {
                      storeFile file('../../android_template/rindemas.jks')
                      storePassword 'rindemas123'
                      keyAlias 'rindemas'
                      keyPassword 'rindemas123'
                  }
              }
          '''
          content = content.replace('buildTypes {', signing_config + '\n    buildTypes {')
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          with open('android/app/build.gradle', 'w') as f: f.write(content)
          "

      - name: Descargar Gradle 9.3.1 con reintentos automaticos
        run: |
          echo "Descargando gradle-9.3.1-bin.zip..."
          curl -fL --retry 10 --retry-delay 5 --retry-connrefused -o /tmp/gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          ls -lh /tmp/gradle-9.3.1-bin.zip
          # Configurar wrapper para usar el archivo local descargado
          sed -i 's|distributionUrl=.*|distributionUrl=file\:/tmp/gradle-9.3.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Instalar paquetes
        run: flutter pub get

      - name: Generar Iconos de App
        run: flutter pub run flutter_launcher_icons

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      - name: Publicar Release (Descarga Directa)
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "latest"
          name: "Ultima Version"
          body: "Descarga directa de la ultima version estable de GastoScan AI."
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
