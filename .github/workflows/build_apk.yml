name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'landing/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.firebaserc'
      - '.github/workflows/deploy_web.yml'
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'scripts/**'
      - 'LICENSE'
      - '.gitignore'
      - '.githooks/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          # Version exacta congelada (stable del 29/10/2026, Dart 3.13.7).
          # No volver a 'stable' flotante: rompe la reproducibilidad del build.
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Restaurar Keystore de Produccion desde Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64. Configura los 4 secretos de firma antes de compilar."
            exit 1
          fi
          if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          mkdir -p android_template
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android_template/rindemas.jks
          SHA1=$(keytool -list -v -keystore android_template/rindemas.jks -alias "${KEY_ALIAS:-rindemas}" -storepass "$KEYSTORE_PASSWORD" | grep -i 'SHA1:' | head -1 | sed 's/.*SHA1: *//' | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          echo "SHA-1 del keystore restaurado: $SHA1"
          if [ "$SHA1" != "d3850d17340bee8de4161db8faddd5121f020d10" ]; then
            echo "::error::El keystore restaurado NO es la clave de subida oficial (se esperaba D3:85:0D:17:34:0B:EE:8D:E4:16:1D:B8:FA:DD:D5:12:1F:02:0D:10). Abortando para no producir un AAB invalido."
            exit 1
          fi



      - name: Descargar Gradle 9.3.1 con reintentos automaticos
        run: |
          echo "Descargando gradle-9.3.1-bin.zip..."
          curl -fL --retry 10 --retry-delay 5 --retry-connrefused -o /tmp/gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          ls -lh /tmp/gradle-9.3.1-bin.zip
          # Configurar wrapper para usar el archivo local descargado
          sed -i 's|distributionUrl=.*|distributionUrl=file\:/tmp/gradle-9.3.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Instalar paquetes
        run: flutter pub get

      - name: Verificar que pubspec.lock este actualizado
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            echo "::error::pubspec.lock quedo desactualizado tras flutter pub get. Regeneralo con Flutter 3.47.9 y commitealo."
            git diff -- pubspec.lock | head -40
            exit 1
          fi

      - name: Subir pubspec.lock como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          if-no-files-found: ignore

      - name: Analisis Estatico de Codigo
        run: |
          rm -f test_results.txt
          touch test_results.txt
          flutter analyze --fatal-warnings --no-fatal-infos || (flutter analyze > test_results.txt && cat test_results.txt && exit 1)

      - name: Ejecutar Unit Tests
        id: run_unit_tests
        run: flutter test > test_results.txt || (cat test_results.txt && exit 1)

      - name: Subir Reporte de Pruebas como Artefacto
        if: always() && hashFiles('test_results.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Generar Iconos de App
        run: flutter pub run flutter_launcher_icons

      - name: Configurar Reglas de ProGuard (R8) para ML Kit y Plugins de Flutter
        run: |
          mkdir -p android/app
          cat << 'EOF' > android/app/proguard-rules.pro
          # Desactivar ofuscación y optimización para código Java/Kotlin en Flutter
          -dontobfuscate
          -dontoptimize
          -ignorewarnings

          # Suprimir advertencias de dependencias opcionales
          -dontwarn kotlin.**
          -dontwarn kotlinx.**
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**

          # Google ML Kit Text Recognition
          -keep class com.google.mlkit.vision.text.latin.** { *; }
          -keep class com.google_mlkit_text_recognition.** { *; }

          # Flutter Platform Channels, Pigeon y Plugins
          -keep class io.flutter.** { *; }
          -keep class dev.flutter.** { *; }
          -keep class dev.fluttercommunity.** { *; }
          -keep class com.it_nomads.fluttersecurestorage.** { *; }
          -keep class com.tekartik.sqflite.** { *; }
          -keep class com.dexterous.flutterlocalnotifications.** { *; }
          -dontwarn com.google.firebase.messaging.**
          -keep class com.google.firebase.messaging.** { *; }
          -keep class com.google.firebase.iid.** { *; }
          -keep class * implements io.flutter.plugin.common.MethodChannel$MethodCallHandler { *; }
          -keep class * implements io.flutter.plugin.common.PluginRegistry$PluginRegistrantCallback { *; }

          # Preservar Kotlin stdlib, corrutinas, JNI y firmas de reflexión
          -keep class kotlin.** { *; }
          -keep class kotlinx.** { *; }
          -keep interface kotlin.** { *; }
          -keep interface kotlinx.** { *; }
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
          EOF
          
          # Inyectar configuracion de proguard-rules.pro y fijar targetSdk 36 en android/app/build.gradle.kts
          python3 -c '
          with open("android/app/build.gradle.kts", "r") as f:
              content = f.read()
          # Usar unicamente proguard-rules.pro sin la plantilla agresiva proguard-android-optimize.txt
          content = content.replace("proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")", "proguardFiles(\"proguard-rules.pro\")")
          if "proguardFiles" not in content:
              target = "signingConfig = signingConfigs.getByName(\"debug\")"
              replacement = target + "\n            proguardFiles(\"proguard-rules.pro\")"
              content = content.replace(target, replacement)
          content = content.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
          with open("android/app/build.gradle.kts", "w") as f:
              f.write(content)
          '
          cat android/app/proguard-rules.pro
          cat android/app/build.gradle.kts

      - name: Compilar Android App Bundle (AAB de Produccion)
        id: compile_aab
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e -o pipefail
          APP_VERSION=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 1 | tr -d '[:space:]')
          BASE_BUILD=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 2 | tr -d '[:space:]')
          BUILD_NUM=$(( BASE_BUILD + ${{ github.run_number }} ))
          echo "Compilando AAB para Google Play v$APP_VERSION (Build $BUILD_NUM)..."
          flutter build appbundle --release --no-tree-shake-icons --build-name="$APP_VERSION" --build-number="$BUILD_NUM" 2>&1 | tee aab_build_log.txt

      - name: Subir Log de Error de AAB como Artefacto
        if: failure() && steps.compile_aab.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: aab-build-failure-log
          path: aab_build_log.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Verificar Firma Oficial Unica del AAB
        run: |
          set -euo pipefail
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab
          SHA256_AAB=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d '[:space:]:' | tr 'A-F' 'a-f')
          echo "SHA-256 del firmante del AAB: $SHA256_AAB"
          if [ "$SHA256_AAB" != "b206e47b5363049f0ed9d1e184229db8994d4aeb889512e51196c8ee2869145d" ]; then
            echo "::error::El AAB no esta firmado con la clave de subida oficial. Revisa los secrets ANDROID_KEYSTORE_*."
            exit 1
          fi
          echo "Firma verificada contra la huella oficial de la clave de subida."

      - name: Subir AAB como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Configurar y Compilar APK Dev (Rinde Más Dev)
        id: compile_apk_dev
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e -o pipefail
          run_apk_dev_build() {
            set -e -o pipefail
            APP_VERSION=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 1 | tr -d '[:space:]')
            BASE_BUILD=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 2 | tr -d '[:space:]')
            BUILD_NUM=$(( BASE_BUILD + ${{ github.run_number }} ))
            
            # Inyectar applicationId .dev y nombre Rinde Mas Dev para coexistencia en dispositivo
            python3 -c '
            with open("android/app/build.gradle.kts", "r") as f:
                content = f.read()
            content = content.replace("applicationId = \"com.cesarluis.rindemas\"", "applicationId = \"com.cesarluis.rindemas.dev\"")
            with open("android/app/build.gradle.kts", "w") as f:
                f.write(content)

            with open("android/app/src/main/AndroidManifest.xml", "r") as f:
                manifest = f.read()
            manifest = manifest.replace("android:label=\"Rinde Más\"", "android:label=\"Rinde Más Dev\"")
            with open("android/app/src/main/AndroidManifest.xml", "w") as f:
                f.write(manifest)
            '
            
            echo "Compilando Rinde Más Dev v$APP_VERSION (Build $BUILD_NUM)..."
            flutter build apk --release --no-tree-shake-icons --build-name="$APP_VERSION" --build-number="$BUILD_NUM"
            
            # Firmar APK Dev con Keystore
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BUILD_TOOLS/zipalign -v -p 4 build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/rindemas-dev-aligned.apk
            $BUILD_TOOLS/apksigner sign --ks android_template/rindemas.jks --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" --ks-key-alias "${ANDROID_KEY_ALIAS:-rindemas}" --key-pass "pass:${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" --out build/app/outputs/flutter-apk/rindemas-dev.apk build/app/outputs/flutter-apk/rindemas-dev-aligned.apk
          }
          run_apk_dev_build 2>&1 | tee apk_dev_build_log.txt

      - name: Subir Log de Error de APK Dev como Artefacto
        if: failure() && steps.compile_apk_dev.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-failure-log
          path: apk_dev_build_log.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Subir APK Dev como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: rindemas-dev-apk
          path: build/app/outputs/flutter-apk/rindemas-dev.apk
          retention-days: 14
