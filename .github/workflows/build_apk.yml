name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'landing/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.firebaserc'
      - '.github/workflows/deploy_web.yml'
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - 'scripts/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar y guardar Keystore Permanente
        run: |
          if [ ! -f "android_template/rindemas.jks" ]; then
            keytool -genkey -v -keystore android_template/rindemas.jks -keyalg RSA -keysize 2048 -validity 10000 -alias rindemas -dname "CN=RindeMas, OU=App, O=RindeMas, L=Caracas, ST=Caracas, C=VE" -storepass rindemas123 -keypass rindemas123
            git config --global user.email "bot@gastoscan.ai"
            git config --global user.name "GastoScan Bot"
            git add android_template/rindemas.jks
            git commit -m "chore: generar keystore de produccion para Google Sign-In"
            git push
          fi
          echo "==== HUELLA SHA-1 PARA FIREBASE ===="
          keytool -list -v -keystore android_template/rindemas.jks -alias rindemas -storepass rindemas123 -keypass rindemas123 | grep SHA1



      - name: Descargar Gradle 9.3.1 con reintentos automaticos
        run: |
          echo "Descargando gradle-9.3.1-bin.zip..."
          curl -fL --retry 10 --retry-delay 5 --retry-connrefused -o /tmp/gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          ls -lh /tmp/gradle-9.3.1-bin.zip
          # Configurar wrapper para usar el archivo local descargado
          sed -i 's|distributionUrl=.*|distributionUrl=file\:/tmp/gradle-9.3.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Instalar paquetes
        run: flutter pub get

      - name: Subir pubspec.lock como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          if-no-files-found: ignore

      - name: Analisis Estatico de Codigo
        run: |
          touch test_results.txt
          flutter analyze --fatal-warnings --no-fatal-infos || (flutter analyze > test_results.txt && cat test_results.txt && exit 1)

      - name: Ejecutar Unit Tests
        run: flutter test > test_results.txt || (cat test_results.txt && exit 1)

      - name: Guardar Logs de Error
        if: failure()
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add test_results.txt
          git commit -m "chore: ci test failure logs"
          git push || true
          exit 1

      - name: Generar Iconos de App
        run: flutter pub run flutter_launcher_icons

      - name: Configurar Reglas de ProGuard (R8) para ML Kit y Plugins de Flutter
        run: |
          mkdir -p android/app
          cat << 'EOF' > android/app/proguard-rules.pro
          # Desactivar ofuscación y optimización para código Java/Kotlin en Flutter
          -dontobfuscate
          -dontoptimize
          -ignorewarnings

          # Suprimir advertencias de dependencias opcionales
          -dontwarn kotlin.**
          -dontwarn kotlinx.**
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**

          # Google ML Kit Text Recognition
          -keep class com.google.mlkit.vision.text.latin.** { *; }
          -keep class com.google_mlkit_text_recognition.** { *; }

          # Flutter Platform Channels, Pigeon y Plugins
          -keep class io.flutter.** { *; }
          -keep class dev.flutter.** { *; }
          -keep class dev.fluttercommunity.** { *; }
          -keep class com.it_nomads.fluttersecurestorage.** { *; }
          -keep class com.tekartik.sqflite.** { *; }
          -keep class com.dexterous.flutterlocalnotifications.** { *; }
          -keep class * implements io.flutter.plugin.common.MethodChannel$MethodCallHandler { *; }
          -keep class * implements io.flutter.plugin.common.PluginRegistry$PluginRegistrantCallback { *; }

          # Preservar Kotlin stdlib, corrutinas, JNI y firmas de reflexión
          -keep class kotlin.** { *; }
          -keep class kotlinx.** { *; }
          -keep interface kotlin.** { *; }
          -keep interface kotlinx.** { *; }
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
          EOF
          
          # Inyectar configuracion de proguard-rules.pro y fijar targetSdk 36 en android/app/build.gradle.kts
          python3 -c '
          with open("android/app/build.gradle.kts", "r") as f:
              content = f.read()
          # Usar unicamente proguard-rules.pro sin la plantilla agresiva proguard-android-optimize.txt
          content = content.replace("proguardFiles(getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\")", "proguardFiles(\"proguard-rules.pro\")")
          if "proguardFiles" not in content:
              target = "signingConfig = signingConfigs.getByName(\"debug\")"
              replacement = target + "\n            proguardFiles(\"proguard-rules.pro\")"
              content = content.replace(target, replacement)
          content = content.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
          with open("android/app/build.gradle.kts", "w") as f:
              f.write(content)
          '
          cat android/app/proguard-rules.pro
          cat android/app/build.gradle.kts

      - name: Compilar Android App Bundle (AAB de Produccion)
        run: |
          set -e -o pipefail
          APP_VERSION=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 1 | tr -d '[:space:]')
          BASE_BUILD=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 2 | tr -d '[:space:]')
          BUILD_NUM=$(( BASE_BUILD + ${{ github.run_number }} ))
          echo "Compilando AAB para Google Play v$APP_VERSION (Build $BUILD_NUM)..."
          flutter build appbundle --release --no-tree-shake-icons --build-name="$APP_VERSION" --build-number="$BUILD_NUM" 2>&1 | tee -a build_log.txt || (tail -n 120 build_log.txt > test_results.txt && exit 1)

      - name: Guardar Logs de Error de AAB
        if: failure()
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add test_results.txt
          git commit -m "chore: ci aab build failure logs" || true
          git push || true

      - name: Verificar Firma Oficial Unica del AAB
        run: |
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab

      - name: Subir AAB como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Configurar y Compilar APK Dev (Rinde Más Dev)
        run: |
          set -e -o pipefail
          APP_VERSION=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 1 | tr -d '[:space:]')
          BASE_BUILD=$(grep "^version:" pubspec.yaml | sed -e 's/version:[[:space:]]*//' | cut -d '+' -f 2 | tr -d '[:space:]')
          BUILD_NUM=$(( BASE_BUILD + ${{ github.run_number }} ))
          
          # Inyectar applicationId .dev y nombre Rinde Mas Dev para coexistencia en dispositivo
          python3 -c '
          with open("android/app/build.gradle.kts", "r") as f:
              content = f.read()
          content = content.replace("applicationId = \"com.cesarluis.rindemas\"", "applicationId = \"com.cesarluis.rindemas.dev\"")
          with open("android/app/build.gradle.kts", "w") as f:
              f.write(content)

          with open("android/app/src/main/AndroidManifest.xml", "r") as f:
              manifest = f.read()
          manifest = manifest.replace("android:label=\"Rinde Más\"", "android:label=\"Rinde Más Dev\"")
          with open("android/app/src/main/AndroidManifest.xml", "w") as f:
              f.write(manifest)
          '
          
          echo "Compilando Rinde Más Dev v$APP_VERSION (Build $BUILD_NUM)..."
          flutter build apk --release --no-tree-shake-icons --build-name="$APP_VERSION" --build-number="$BUILD_NUM" 2>&1 | tee build_log.txt || (tail -n 120 build_log.txt > test_results.txt && exit 1)
          
          # Firmar APK Dev con Keystore
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BUILD_TOOLS/zipalign -v -p 4 build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/rindemas-dev-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks android_template/rindemas.jks --ks-pass pass:rindemas123 --ks-key-alias rindemas --key-pass pass:rindemas123 --out build/app/outputs/flutter-apk/rindemas-dev.apk build/app/outputs/flutter-apk/rindemas-dev-aligned.apk

      - name: Guardar Logs de Error de APK Dev
        if: failure()
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add test_results.txt
          git commit -m "chore: ci dev apk build failure logs" || true
          git push || true

      - name: Subir APK Dev como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: rindemas-dev-apk
          path: build/app/outputs/flutter-apk/rindemas-dev.apk
          retention-days: 14
