name: Compilar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar y guardar Keystore Permanente
        run: |
          if [ ! -f "android_template/rindemas.jks" ]; then
            keytool -genkey -v -keystore android_template/rindemas.jks -keyalg RSA -keysize 2048 -validity 10000 -alias rindemas -dname "CN=RindeMas, OU=App, O=RindeMas, L=Caracas, ST=Caracas, C=VE" -storepass rindemas123 -keypass rindemas123
            git config --global user.email "bot@gastoscan.ai"
            git config --global user.name "GastoScan Bot"
            git add android_template/rindemas.jks
            git commit -m "chore: generar keystore de produccion para Google Sign-In"
            git push
          fi
          echo "==== HUELLA SHA-1 PARA FIREBASE ===="
          keytool -list -v -keystore android_template/rindemas.jks -alias rindemas -storepass rindemas123 -keypass rindemas123 | grep SHA1

      - name: Generar plataforma Android nativa y aplicar permisos
        run: |
          rm -rf android
          flutter create --org com.gastoscan.ai --project-name gastoscan_ai --platforms android .
          cp android_template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          if [ -f "android_template/google-services.json" ]; then
            cp android_template/google-services.json android/app/google-services.json
          fi
          
          # Fix package name to match Firebase exactly
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/namespace = "com.gastoscan.ai.gastoscan_ai"/namespace = "com.gastoscan.ai"/g' android/app/build.gradle.kts
            sed -i 's/applicationId = "com.gastoscan.ai.gastoscan_ai"/applicationId = "com.gastoscan.ai"/g' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/namespace "com.gastoscan.ai.gastoscan_ai"/namespace "com.gastoscan.ai"/g' android/app/build.gradle
            sed -i 's/applicationId "com.gastoscan.ai.gastoscan_ai"/applicationId "com.gastoscan.ai"/g' android/app/build.gradle
          fi
          
          mkdir -p android/app/src/main/kotlin/com/gastoscan/ai
          mv android/app/src/main/kotlin/com/gastoscan/ai/gastoscan_ai/MainActivity.kt android/app/src/main/kotlin/com/gastoscan/ai/ 2>/dev/null || true
          rm -rf android/app/src/main/kotlin/com/gastoscan/ai/gastoscan_ai 2>/dev/null || true
          sed -i 's/package com.gastoscan.ai.gastoscan_ai/package com.gastoscan.ai/g' android/app/src/main/kotlin/com/gastoscan/ai/MainActivity.kt

      - name: Habilitar Desugaring y Google Services en build.gradle
        run: |
          # 1. Habilitar Google Services Plugin y Crashlytics Plugin
          if [ -f "android_template/google-services.json" ]; then
            if [ -f "android/settings.gradle.kts" ]; then
              sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false\n    id("com.google.firebase.crashlytics") version "3.0.2" apply false/g' android/settings.gradle.kts
              sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")\n    id("com.google.firebase.crashlytics")/g' android/app/build.gradle.kts
            elif [ -f "android/settings.gradle" ]; then
              sed -i 's/plugins {/plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false\n    id "com.google.firebase.crashlytics" version "3.0.2" apply false/g' android/settings.gradle
              sed -i 's/plugins {/plugins {\n    id "com.google.gms.google-services"\n    id "com.google.firebase.crashlytics"/g' android/app/build.gradle
            elif [ -f "android/build.gradle.kts" ]; then
              sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false\n    id("com.google.firebase.crashlytics") version "3.0.2" apply false/g' android/build.gradle.kts
              sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")\n    id("com.google.firebase.crashlytics")/g' android/app/build.gradle.kts
            elif [ -f "android/build.gradle" ]; then
              sed -i 's/dependencies {/dependencies {\n        classpath "com.google.gms:google-services:4.4.2"\n        classpath "com.google.firebase:firebase-crashlytics-gradle:3.0.2"/g' android/build.gradle
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
              echo "apply plugin: 'com.google.firebase.crashlytics'" >> android/app/build.gradle
            fi
          fi

          # 2. Habilitar Desugaring
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/g' android/app/build.gradle.kts
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4") }' >> android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/g' android/app/build.gradle
            echo "dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4' }" >> android/app/build.gradle
          else
            echo "No build file found!"
            exit 1
          fi

      - name: Descargar Gradle 9.3.1 con reintentos automaticos
        run: |
          echo "Descargando gradle-9.3.1-bin.zip..."
          curl -fL --retry 10 --retry-delay 5 --retry-connrefused -o /tmp/gradle-9.3.1-bin.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          ls -lh /tmp/gradle-9.3.1-bin.zip
          # Configurar wrapper para usar el archivo local descargado
          sed -i 's|distributionUrl=.*|distributionUrl=file\:/tmp/gradle-9.3.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Instalar paquetes
        run: flutter pub get

      - name: Generar Iconos de App
        run: flutter pub run flutter_launcher_icons

      - name: Compilar APK Release
        run: flutter build apk --release --no-tree-shake-icons --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
        
      - name: Firmar APK con Keystore de Produccion
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          # Alineacion
          $BUILD_TOOLS/zipalign -v -p 4 build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-aligned.apk
          # Firma
          $BUILD_TOOLS/apksigner sign --ks android_template/rindemas.jks --ks-pass pass:rindemas123 --ks-key-alias rindemas --key-pass pass:rindemas123 --out build/app/outputs/flutter-apk/app-release-signed.apk build/app/outputs/flutter-apk/app-release-aligned.apk
          # Reemplazar el original
          mv build/app/outputs/flutter-apk/app-release-signed.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar Release (Descarga Directa)
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          tag: "latest"
          name: "Ultima Version"
          body: "Descarga directa de la ultima version estable de GastoScan AI."
          allowUpdates: true
          makeLatest: true
          token: "${{ secrets.GITHUB_TOKEN }}"
