name: Desplegar Web (Landing y Panel)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'landing/**'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - '.firebaserc'
      - '.github/workflows/deploy_web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-web:
    name: Compilar Astro y Desplegar a Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'landing/package-lock.json'

      - name: Instalar Dependencias de Landing
        run: |
          cd landing
          npm ci || npm install
          cd ..

      - name: Compilar Landing y Panel Web (Astro)
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          cd landing
          npm run build
          cd ..

      - name: Desplegar a Firebase Hosting y Reglas de Firestore
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GATOSCAN_AI }}
        run: |
          npx firebase-tools deploy --only hosting,firestore:rules --project gastoscan-ai --token "${{ secrets.FIREBASE_SERVICE_ACCOUNT_GATOSCAN_AI }}" --non-interactive
